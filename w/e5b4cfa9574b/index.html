<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Shalosh</title>
<meta name="description" content="Three Hebrew words a day, pinned over whatever you're watching.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#100f0e">

<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shalosh">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>

<body>

<!-- ============================ library ============================ -->
<div class="shell" id="shell">

  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <h1>Shalosh</h1>
    </div>
    <button class="ghost-btn" id="storage-btn" type="button" aria-label="Storage used">
      <span id="storage-text">—</span>
    </button>
  </header>

  <!-- the three tabs sit at the very top, across the full width -->
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" class="tab is-on" data-tab="video" aria-selected="true">Videos</button>
    <button role="tab" class="tab" data-tab="audio" aria-selected="false">Audio</button>
    <button role="tab" class="tab" data-tab="words" aria-selected="false">Words</button>
    <span class="tab-ink" id="tab-ink" aria-hidden="true"></span>
  </nav>

  <!-- the three slots live here, and move into the player when one opens -->
  <section class="today" id="today" aria-label="Today's three words">
    <div class="today-head">
      <span class="label">Today</span>
      <span class="label dim" id="today-date"></span>
    </div>
    <div class="slots" id="slots"></div>
  </section>

  <main class="library" id="library"></main>

  <footer class="dock">
    <button class="add-btn" id="add-btn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Add from iCloud Drive
    </button>
  </footer>
</div>

<!-- ============================ player ============================= -->
<section class="player" id="player" hidden aria-label="Player">
  <div class="stage" id="stage">
    <video id="video" playsinline webkit-playsinline preload="metadata"></video>
    <div class="art" id="art" hidden><img id="art-img" alt=""></div>
    <div class="dim" id="dim" aria-hidden="true"></div>
    <div class="scrim top"></div>
    <div class="scrim bottom"></div>

    <!-- #today is moved in here while playing -->

    <div class="subs" id="subs" aria-live="off"></div>

    <div class="chrome" id="chrome">
      <div class="chrome-top">
        <button class="ctl" id="back-btn" type="button" aria-label="Back to library">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="now">
          <p id="now-title"></p>
          <span class="label dim" id="now-kind">Video</span>
        </div>
        <button class="ctl" id="full-btn" type="button" aria-label="Full screen">
          <svg viewBox="0 0 24 24" id="full-icon"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>

      <div class="chrome-mid">
        <button class="ctl skip" id="back10" type="button" aria-label="Back 10 seconds">
          <svg viewBox="0 0 24 24" class="solid"><path d="M12 5V1L7 6l5 5V7a6 6 0 11-6 6H4a8 8 0 108-8z"/></svg>
          <b>10</b>
        </button>
        <button class="ctl play" id="play-btn" type="button" aria-label="Play">
          <svg viewBox="0 0 24 24" class="solid" id="play-icon"><path d="M7 4l13 8-13 8z"/></svg>
        </button>
        <button class="ctl skip" id="fwd10" type="button" aria-label="Forward 10 seconds">
          <svg viewBox="0 0 24 24" class="solid"><path d="M12 5V1l5 5-5 5V7a6 6 0 106 6h2a8 8 0 11-8-8z"/></svg>
          <b>10</b>
        </button>
      </div>

      <div class="chrome-bottom">
        <div class="scrub" id="scrub">
          <div class="track"><span class="buf" id="buf"></span><span class="fill" id="fill"></span><span class="knob" id="knob"></span></div>
          <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
        </div>
        <div class="times">
          <span id="t-now">0:00</span>
          <span id="t-left">-0:00</span>
        </div>

        <div class="slider-row" id="slider-row" hidden>
          <span class="s-icon" id="s-icon" aria-hidden="true"></span>
          <input type="range" id="s-range" min="0" max="100" value="100" aria-label="Level">
          <span class="s-val" id="s-val">100%</span>
        </div>

        <div class="actions" id="actions">
          <button class="action" id="lock-btn" type="button">
            <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
            <span>Lock</span>
          </button>
          <button class="action" id="subs-btn" type="button">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 14h4M14 14h3"/></svg>
            <span>Subtitles</span>
          </button>
          <button class="action" id="speed-btn" type="button">
            <svg viewBox="0 0 24 24"><path d="M12 20a8 8 0 10-8-8"/><path d="M12 12l4.5-3.5"/></svg>
            <span>Speed</span>
          </button>
          <button class="action" id="bright-btn" type="button">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
            <span>Brightness</span>
          </button>
          <button class="action" id="vol-btn" type="button">
            <svg viewBox="0 0 24 24"><path d="M5 10v4h3l4 3V7L8 10H5z"/><path d="M16 9.5a3.5 3.5 0 010 5M18.5 7a7 7 0 010 10"/></svg>
            <span>Volume</span>
          </button>
        </div>
      </div>
    </div>

    <!-- VLC: a vertical bar on the edge you are swiping -->
    <div class="vbar left" id="vb-bright" hidden aria-hidden="true">
      <span class="vb-val" id="vb-bright-val">100%</span>
      <span class="vb-track"><i id="vb-bright-fill"></i></span>
      <span class="vb-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
      </span>
    </div>
    <div class="vbar right" id="vb-vol" hidden aria-hidden="true">
      <span class="vb-val" id="vb-vol-val">100%</span>
      <span class="vb-track"><i id="vb-vol-fill"></i></span>
      <span class="vb-icon" id="vb-vol-icon">
        <svg viewBox="0 0 24 24"><path d="M5 10v4h3l4 3V7L8 10H5z"/><path d="M16 9.5a3.5 3.5 0 010 5M18.5 7a7 7 0 010 10"/></svg>
      </span>
    </div>

    <!-- scrubbing sideways gets a centred readout, like VLC -->
    <div class="hud" id="hud" hidden>
      <span class="hud-val" id="hud-val"></span>
      <span class="hud-at" id="hud-at"></span>
    </div>

    <!-- double tap: the YouTube/Netflix half-circle ripple -->
    <div class="ripple" id="ripple" hidden aria-hidden="true">
      <span class="ripple-core" id="ripple-core">
        <span class="chev">
          <svg viewBox="0 0 24 24"><path d="M13 5l-7 7 7 7"/></svg>
          <svg viewBox="0 0 24 24"><path d="M13 5l-7 7 7 7"/></svg>
          <svg viewBox="0 0 24 24"><path d="M13 5l-7 7 7 7"/></svg>
        </span>
        <span class="ripple-text" id="ripple-text">10 seconds</span>
      </span>
    </div>

    <button class="unlock" id="unlock-btn" type="button" hidden>
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
      <span>Locked — tap to unlock</span>
    </button>
  </div>
</section>

<!-- ======================== options panel ========================== -->
<div class="panel-wrap" id="panel-wrap" hidden>
  <div class="panel-bg" id="panel-bg"></div>
  <section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <span class="grabber" aria-hidden="true"></span>
    <h2 id="panel-title">Subtitles</h2>
    <p class="panel-note" id="panel-note" hidden></p>
    <ul class="panel-list" id="panel-list"></ul>
    <div class="speed-rail" id="speed-rail" hidden>
      <div class="rail"><span class="rail-fill" id="rail-fill"></span></div>
      <div class="rail-stops" id="rail-stops"></div>
    </div>
    <button class="ghost-btn panel-close" id="panel-close" type="button">Close</button>
  </section>
</div>

<!-- ============================ word sheet ========================= -->
<div class="sheet-wrap" id="sheet-wrap" hidden>
  <div class="sheet-bg" id="sheet-bg"></div>
  <form class="sheet" id="sheet" autocomplete="off">
    <span class="grabber" aria-hidden="true"></span>
    <div class="sheet-head">
      <span class="label" id="sheet-label">Word one</span>
      <button class="ghost-btn danger" id="sheet-del" type="button" hidden>Remove</button>
    </div>

    <input class="he" id="f-he" dir="rtl" lang="he" placeholder="מילה" aria-label="Hebrew word">
    <div class="suggest" id="suggest" hidden></div>
    <input class="en" id="f-en" placeholder="what it means" aria-label="Meaning">
    <input class="tr" id="f-tr" placeholder="how it sounds (optional)" aria-label="Transliteration">

    <div class="sheet-foot">
      <button class="ghost-btn" id="sheet-cancel" type="button">Cancel</button>
      <button class="save-btn" id="sheet-save" type="submit">Save word</button>
    </div>
  </form>
</div>

<!-- ============================ importing ========================== -->
<div class="import-wrap" id="import-wrap" hidden>
  <div class="import-bg"></div>
  <section class="import" role="status" aria-live="polite">
    <header>
      <div>
        <span class="label" id="imp-stage">Copying onto this device</span>
        <p id="imp-count">—</p>
      </div>
      <span class="spinner" id="imp-spin" aria-hidden="true"></span>
    </header>

    <div class="imp-bar"><i id="imp-fill"></i></div>
    <p class="imp-now" id="imp-now"></p>

    <ul class="imp-list" id="imp-list"></ul>

    <footer>
      <span class="label dim" id="imp-quota"></span>
      <button class="ghost-btn" id="imp-done" type="button" hidden>Done</button>
    </footer>
  </section>
</div>

<input type="file" id="filepick" multiple hidden>
<div class="toast" id="toast" hidden></div>
<div class="grain" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
